<title>Earbuds | Khushi Mobile Point, Sapotra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@800&family=Public+Sans:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e2dedd;color:#141516;font-family:'Public Sans',system-ui,sans-serif;padding-bottom:84px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#0a0b0c;color:#F7F5EF}
.top a{color:#F7F5EF;text-decoration:none;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:8px 12px;white-space:nowrap}
.top b{font:800 clamp(16px,4.2vw,24px)/1.1 'Exo 2',sans-serif;text-transform:uppercase}
.wrap{max-width:1120px;margin:0 auto;padding:28px 18px}
.hero{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center;padding-bottom:26px;border-bottom:1px solid rgba(20,21,22,.16)}
.hero .pic{height:200px;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.hero .pic img{width:100%;height:100%;object-fit:contain}
.hero h1{margin:0 0 10px;font:800 clamp(28px,5vw,52px)/1 'Exo 2',sans-serif;text-transform:uppercase}
.hero p{margin:0;font-size:15px;line-height:1.5;opacity:.75;max-width:520px}
.sb{width:100%;margin:26px 0 8px;padding:14px 16px;font:inherit;font-size:16px;border:1px solid rgba(20,21,22,.25);border-radius:10px;background:#fff}
.cnt{margin:0 0 10px;font-size:13px;opacity:.65}
.bh{margin:26px 0 12px;font:800 20px/1 'Exo 2',sans-serif;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.grid div{background:#fff;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:transform .15s}
.grid div:hover{transform:translateY(-2px)}
.grid small{display:block;margin-top:5px;font-weight:400;font-size:12px;color:#2e7d32}
.none a,.btn{display:inline-block;padding:12px 20px;border-radius:8px;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.wa{background:#25d366}.call{background:#2e7d32}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.45))}
footer{text-align:center;padding:20px;background:#222;color:#fff;font-size:14px}
@media(max-width:600px){.hero{grid-template-columns:1fr}.hero .pic{height:170px}}
</style></head>
